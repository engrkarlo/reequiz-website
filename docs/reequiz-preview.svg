<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">REEQUIZ study workspace</title><desc id="desc">A dark, gold-accented quiz dashboard illustration showing a question, multiple choice answers, and study progress.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10121b"/><stop offset="1" stop-color="#1b1d27"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe69a"/><stop offset="1" stop-color="#d8a928"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e7c45e" stop-opacity="0"/><stop offset=".5" stop-color="#e7c45e" stop-opacity=".2"/><stop offset="1" stop-color="#e7c45e" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="558" rx="29" fill="none" stroke="#5c5134" stroke-width="2"/><rect width="1200" height="560" rx="30" fill="url(#glow)"/>
<g font-family="Inter,Arial,sans-serif"><text x="58" y="66" fill="#f6d66d" font-size="18" font-weight="700" letter-spacing="5">YOUR PERSONAL QUIZ STUDIO</text><text x="58" y="130" fill="#fff9e9" font-size="48" font-weight="800">Learn more.</text><text x="58" y="184" fill="#f2d16b" font-size="48" font-weight="800">Remember longer.</text><text x="60" y="226" fill="#b3b4bd" font-size="19">A calmer way to practice, review, and track your progress.</text>
<rect x="58" y="274" width="400" height="210" rx="20" fill="#171922" stroke="#393b46" stroke-width="2"/><text x="82" y="310" fill="#9b9eac" font-size="13" font-weight="700" letter-spacing="2">STUDY PROGRESS</text><text x="82" y="359" fill="#fff8e5" font-size="34" font-weight="700">Keep your streak going</text><rect x="82" y="383" width="350" height="10" rx="5" fill="#343541"/><rect x="82" y="383" width="245" height="10" rx="5" fill="url(#gold)"/><text x="82" y="428" fill="#b9bac4" font-size="15">Progress stays on your device</text><text x="82" y="455" fill="#e8c85f" font-size="15">No account required</text>
<rect x="510" y="54" width="632" height="452" rx="24" fill="#12141d" stroke="#3c3e4a" stroke-width="2"/><text x="548" y="96" fill="#e8c85f" font-size="13" font-weight="700" letter-spacing="2">PRACTICE SESSION</text><text x="548" y="144" fill="#f8f5ec" font-size="23" font-weight="700">Which quantity describes the ratio</text><text x="548" y="176" fill="#f8f5ec" font-size="23" font-weight="700">of real power to apparent power?</text>
<rect x="548" y="204" width="556" height="54" rx="12" fill="#1c1e29" stroke="#3d3f4b"/><circle cx="576" cy="231" r="13" fill="#2c2e3b"/><text x="572" y="236" fill="#c9cbd5" font-size="13" font-weight="700">A</text><text x="604" y="237" fill="#d8d9e0" font-size="17">Efficiency</text>
<rect x="548" y="270" width="556" height="54" rx="12" fill="#25251e" stroke="#d7b94f" stroke-width="2"/><circle cx="576" cy="297" r="13" fill="url(#gold)"/><text x="572" y="302" fill="#242116" font-size="13" font-weight="700">B</text><text x="604" y="303" fill="#fff4c6" font-size="17" font-weight="600">Power factor</text><path d="M1066 293l7 7 13-15" fill="none" stroke="#f1d36b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="548" y="336" width="556" height="54" rx="12" fill="#1c1e29" stroke="#3d3f4b"/><circle cx="576" cy="363" r="13" fill="#2c2e3b"/><text x="572" y="368" fill="#c9cbd5" font-size="13" font-weight="700">C</text><text x="604" y="369" fill="#d8d9e0" font-size="17">Reactance</text>
<rect x="548" y="402" width="556" height="54" rx="12" fill="#1c1e29" stroke="#3d3f4b"/><circle cx="576" cy="429" r="13" fill="#2c2e3b"/><text x="572" y="434" fill="#c9cbd5" font-size="13" font-weight="700">D</text><text x="604" y="435" fill="#d8d9e0" font-size="17">Resistance</text>
</g></svg>