name: Cleanup previously merged assistant branches

on:
  push:
    branches:
      - feat/quiz-studio-column-aware-fast-ocr

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'engrkarlo/reequiz-website'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only unchanged, already-merged assistant-created branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "feat/quiz-studio-20mb-ai-fallback:eb2a4c643d4975aa7eea7a9c55d12495a628b92a" \
            "feat/quiz-studio-fully-offline-ocr:856063612248480d61159e296e7392730867c745"
          do
            branch="${spec%%:*}"
            expected="${spec#*:}"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            if [[ "$current" != "$expected" ]]; then
              echo "::error::Ref ${branch} changed: refusing to delete."
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted ${branch}"
          done
